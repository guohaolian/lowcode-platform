# /etc/nginx/sites-available/lowcode-frontend-8033.conf
# 说明：Vite 构建后的静态文件目录为 /opt/lowcode/www/frontend

server {
    listen 8033;
    listen [::]:8033;

    # 如果你有域名，改成：server_name example.com;
    server_name _;

    root /opt/lowcode/www/frontend;
    index index.html;

    access_log /var/log/nginx/lowcode-frontend-8033.access.log;
    error_log  /var/log/nginx/lowcode-frontend-8033.error.log;

    # 建议限制最大请求体（按需调大/调小）
    client_max_body_size 25m;

    # 单页应用（SPA）路由支持：非真实文件路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 默认会给资源名加 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 基础安全响应头（按需保留/调整）
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip（如果你的 nginx 全局已开，这段可删）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml+rss application/xml image/svg+xml;
    gzip_vary on;
}
